name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Puertas de calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (actions/checkout v7.0.1, pinned SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Node LTS 22 (actions/setup-node v7.1.0, pinned SHA)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar
        run: npm ci
      - name: check-data (CONTENT_STRICT en main)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CONTENT_STRICT=1 node scripts/check-data.mjs
          else
            node scripts/check-data.mjs
          fi
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: html-validate
        run: npx html-validate "dist/**/*.html"

  # NOTA (DEL-17): deploy desactivado hasta que existan los secrets CF_API_TOKEN / CF_ACCOUNT_ID.
  # Activar: gh repo variable set DEPLOY_PAGES 1 y agrega los secrets; luego main publica en Pages.
  deploy:
    name: Deploy a Cloudflare Pages (main, tras merge)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (actions/checkout v7.0.1, pinned SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Node LTS 22 (actions/setup-node v7.1.0, pinned SHA)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar y build
        run: |
          npm ci
          npm run build
      # cloudflare/wrangler-action v4.1.3, pinned SHA (fetch vía git ref 15/11/2026).
      # Secrets requeridos (ADR-0007): CF_API_TOKEN (Pages:Edit), CF_ACCOUNT_ID.
      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cetpro --commit-dirty=true
